<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Тренировочный дашборд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#12151c; --panel:#181c26; --panel2:#1f2431; --line:#2a3040;
    --ink:#eef1f6; --mut:#8b93a7; --dim:#5c6479;
    --lime:#c6f24e; --blue:#5b9dff; --red:#ff5d5d; --amber:#ffb454;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
  body{padding:14px;padding-top:calc(14px + var(--safe-t));padding-bottom:calc(20px + var(--safe-b));
    max-width:1100px;margin:0 auto;-webkit-tap-highlight-color:transparent}
  h1,h2,h3{font-family:'Barlow Semi Condensed',sans-serif;margin:0;letter-spacing:-.01em}
  .num{font-family:'Barlow Semi Condensed',sans-serif;font-variant-numeric:tabular-nums}

  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .dot{width:12px;height:12px;border-radius:3px;background:var(--lime);box-shadow:0 0 16px var(--lime);flex:0 0 auto}
  .brand h1{font-size:22px;font-weight:800;text-transform:uppercase;line-height:1}
  .brand span{color:var(--mut);font-size:11px;display:block;font-family:'Inter';text-transform:none;letter-spacing:0}
  .refresh{display:flex;align-items:center;gap:8px;background:var(--lime);color:#10130a;border:none;
    font-family:'Barlow Semi Condensed';font-weight:700;font-size:14px;padding:11px 16px;border-radius:11px;cursor:pointer;
    text-transform:uppercase;letter-spacing:.02em;transition:transform .1s,filter .15s;min-height:44px}
  .refresh:active{transform:scale(.96)}
  .refresh:disabled{filter:grayscale(.5) brightness(.8);cursor:default}
  .refresh svg{width:16px;height:16px}
  .updated{color:var(--dim);font-size:11px;text-align:right;margin:-6px 2px 12px}

  .splits{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .split{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;position:relative;overflow:hidden}
  .split .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dim)}
  .split.ok .bar{background:var(--lime)} .split.due .bar{background:var(--red)}
  .split h3{font-size:15px;font-weight:700;margin-bottom:8px;padding-left:6px}
  .split .big{font-size:30px;font-weight:800;line-height:1;padding-left:6px}
  .split .big.due{color:var(--red)} .split .big.ok{color:var(--lime)}
  .split .sub{color:var(--mut);font-size:12px;padding-left:6px;margin-top:4px}
  .split .tag{position:absolute;top:12px;right:12px;font-size:10px;font-weight:700;text-transform:uppercase;
    padding:3px 7px;border-radius:20px;font-family:'Barlow Semi Condensed';letter-spacing:.04em}
  .tag.ok{background:rgba(198,242,78,.14);color:var(--lime)} .tag.due{background:rgba(255,93,93,.14);color:var(--red)}

  .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .ctl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .ctl label{display:block;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;font-weight:600}
  .ctl select{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:11px 10px;font-size:15px;font-family:'Inter';appearance:none;min-height:44px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='%238b93a7' viewBox='0 0 16 16'><path d='M4 6l4 4 4-4'/></svg>");
    background-repeat:no-repeat;background-position:right 10px center}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700;margin-bottom:14px}
  .panel h2 b{color:var(--ink)}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
  .kpi{background:var(--panel2);border-radius:10px;padding:12px}
  .kpi .k{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;font-weight:600}
  .kpi .v{font-size:24px;font-weight:800;line-height:1}
  .kpi .v.up{color:var(--lime)} .kpi .v.down{color:var(--red)}

  .chartwrap{position:relative;height:260px}

  .exlist{display:flex;flex-direction:column;gap:10px}
  .exrow{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .exrow-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .exrow-name{font-weight:700;font-size:15px;line-height:1.2}
  .delta{font-family:'Barlow Semi Condensed';font-weight:700;font-size:14px;padding:3px 9px;border-radius:20px;white-space:nowrap;flex:0 0 auto}
  .delta.up{background:rgba(198,242,78,.14);color:var(--lime)}
  .delta.down{background:rgba(255,93,93,.14);color:var(--red)}
  .delta.same{background:rgba(139,147,167,.14);color:var(--mut)}
  .exline{display:flex;gap:10px;font-size:13px;padding:3px 0;align-items:baseline}
  .exline .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em;flex:0 0 62px;font-weight:600}
  .exline .val{color:var(--ink);font-variant-numeric:tabular-nums}
  .exline .val b{color:var(--lime);font-family:'Barlow Semi Condensed';font-weight:700}
  .exline.today .val{font-weight:600}
  .exline .date{color:var(--dim);font-size:12px}
  .daytotal{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .daytotal .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  .daytotal .v{font-size:22px;font-weight:800;color:var(--lime);font-family:'Barlow Semi Condensed'}

  .empty{color:var(--dim);text-align:center;padding:26px 10px;font-size:14px}
  .foot{color:var(--dim);font-size:11px;text-align:center;padding:8px 0 20px}
  .err{background:rgba(255,93,93,.12);border:1px solid rgba(255,93,93,.4);color:#ffb4b4;border-radius:10px;padding:12px;margin-bottom:14px;font-size:13px}

  @media (max-width:680px){
    body{padding:12px;padding-top:calc(12px + var(--safe-t))}
    .splits{grid-template-columns:1fr;gap:8px}
    .split{padding:12px}
    .split .big{font-size:26px}
    .controls{grid-template-columns:1fr}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .brand h1{font-size:19px}
    .refresh{flex:1 1 auto;justify-content:center}
    .panel{padding:13px}
    .chartwrap{height:230px}
    .exline .lbl{flex-basis:56px}
  }
  @media (max-width:380px){
    .kpis{grid-template-columns:1fr 1fr}
    .exrow-name{font-size:14px}
  }
  .spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
  <!-- ────────── КОНФИГ: впиши URL веб-приложения и токен ────────── -->
  <script>
    const CONFIG = {
      API_URL: 'https://script.google.com/macros/s/AKfycbw6eLqPh-EPuxi0BqykXbN7RDlekHiMtgfDV4aXDAidZzg_FgWaGJtHJZj12IzW_qWqPA/exec',   // …/exec (тот же, что был)
      TOKEN:   '4ebb626f85a74f80aa37e877215c89dc',                 // тот же токен
      DUE_DAYS: 7,
      SPLITS: {
        A: { name: '🅰️ День A', detail: 'Грудь + спина + квадрицепс' },
        B: { name: '🅱️ День Б', detail: 'Спина + грудь + бицепс бедра' },
        V: { name: '🆅 День В', detail: 'Ноги + плечи + пресс' }
      }
    };
  </script>

  <header>
    <div class="brand">
      <div class="dot"></div>
      <div><h1>Прогресс</h1><span>тренировочный дашборд</span></div>
    </div>
    <button class="refresh" id="refreshBtn" onclick="loadData()">
      <svg id="refreshIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 11A8 8 0 1 0 4 13"/><path d="M20 4v7h-7"/></svg>
      Обновить
    </button>
  </header>
  <div class="updated" id="updated"></div>
  <div id="errbox"></div>

  <section class="splits" id="splits"></section>
  <div class="updated" id="nextWorkout" style="margin-top:-7px;margin-bottom:14px;text-align:left"></div>

  <section class="controls">
    <div class="ctl"><label>Упражнение</label><select id="selExercise" onchange="renderExercise()"></select></div>
    <div class="ctl"><label>Тренировка (дата и сплит)</label><select id="selDate" onchange="renderDay()"></select></div>
  </section>

  <section class="panel">
    <h2>Прогресс — <b id="exTitle">—</b></h2>
    <div class="kpis" id="exKpis"></div>
    <div class="chartwrap"><canvas id="exChart"></canvas></div>
  </section>

  <section class="panel">
    <h2>Тренировка за <b id="dayTitle">—</b></h2>
    <div id="dayBody"></div>
  </section>

  <div class="foot">Данные из Hevy → Google Sheets. Обновляется по кнопке.</div>

<script>
let RAW = [];
let SESSIONS = [];
let exChart = null;

function e1rm(w,r){ return w && r ? w*(1+r/30) : 0; }
function fmtDate(iso){ const p=iso.split('-'); return p[2]+'.'+p[1]+'.'+p[0]; }
function ddmm(iso){ const p=iso.split('-'); return p[2]+'.'+p[1]; }
function daysAgo(iso){ const today=new Date(), date=Date.UTC(...iso.split('-').map((s,i)=>i===1?Number(s)-1:Number(s)));
  return Math.max(0,Math.round((Date.UTC(today.getFullYear(),today.getMonth(),today.getDate())-date)/86400000)); }
function kg(v){ return Math.round(v).toLocaleString('ru-RU')+' кг'; }
function round1(v){ return Math.round(v*10)/10; }
function uniq(a){ return [...new Set(a)]; }
function safe(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadData(){
  const btn=document.getElementById('refreshBtn'), icon=document.getElementById('refreshIcon');
  const err=document.getElementById('errbox'); err.innerHTML='';
  btn.disabled=true; icon.classList.add('spin');
  try{
    if(CONFIG.API_URL.startsWith('ВСТАВЬ')) throw new Error('Не заполнен API_URL/TOKEN в начале файла.');
    const url=CONFIG.API_URL+'?token='+encodeURIComponent(CONFIG.TOKEN);
    const res=await fetch(url);
    const data=await res.json();
    if(data.error) throw new Error(data.error==='unauthorized'?'Неверный токен доступа.':data.error);
    RAW=(data.rows||[]).filter(x=>x.setType!=='warmup').map(x=>({ ...x, e1:e1rm(x.weight,x.reps) }));
    SESSIONS=(data.sessions||[]).map(s=>({ ...s }));
    if(!RAW.length) throw new Error('Данных пока нет — синхронизируй Hevy в таблице.');
    document.getElementById('updated').textContent='Обновлено: '+new Date(data.updated).toLocaleString('ru-RU');
    buildAll();
  }catch(e){
    err.innerHTML='<div class="err">⚠️ '+safe(e.message)+'</div>';
  }finally{
    btn.disabled=false; icon.classList.remove('spin');
  }
}

function buildAll(){ renderSplits(); fillSelectors(); renderExercise(); renderDay(); }

function renderSplits(){
  const box=document.getElementById('splits'); box.innerHTML='';
  const verified=SESSIONS.filter(s=>['A','B','V'].includes(s.split));
  const recent=verified.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
  const next=recent?({A:'B',B:'V',V:'A'})[recent.split]:'A';
  document.getElementById('nextWorkout').textContent=recent
    ? 'Следующий по кругу: '+CONFIG.SPLITS[next].name+' · последняя подтверждённая: '+fmtDate(recent.date)
    : 'Нет подтверждённых дней A/Б/В. Проверь названия шаблонов Hevy и синхронизацию.';
  for(const [id,def] of Object.entries(CONFIG.SPLITS)){
    const last=verified.filter(x=>x.split===id).map(x=>x.date).sort().reverse()[0]||null;
    const d=last?daysAgo(last):null;
    const isNext=id===next;
    const due=isNext;
    const el=document.createElement('div');
    el.className='split '+(due?'due':'ok');
    const tag=due?'следующий':'по кругу';
    el.innerHTML=`<div class="bar"></div>
      <span class="tag ${due?'due':'ok'}">${tag}</span>
      <h3>${safe(def.name)}</h3>
      <div class="big ${due?'due':'ok'}">${d===null?'—':d}<span style="font-size:14px;color:var(--mut);font-weight:600"> ${d===null?'':'дн. назад'}</span></div>
      <div class="sub">${last?'последняя: '+fmtDate(last):'ещё не выполнен'} · ${safe(def.detail)}</div>`;
    box.appendChild(el);
  }
}

function fillSelectors(){
  const se=document.getElementById('selExercise'), oldEx=se.value;
  const exs=uniq(RAW.map(x=>x.exercise)).sort((a,b)=>a.localeCompare(b,'ru'));
  se.innerHTML='';
  exs.forEach(e=>{ const o=document.createElement('option'); o.value=e; o.textContent=e; se.appendChild(o); });
  if(exs.includes(oldEx))se.value=oldEx;

  const sd=document.getElementById('selDate'), old=sd.value; sd.innerHTML='';
  // Каждая тренировка Hevy — отдельный пункт, даже когда в один день две сессии.
  SESSIONS.forEach(s=>{
    const o=document.createElement('option'); o.value=s.id;
    const name=s.split&&CONFIG.SPLITS[s.split]?CONFIG.SPLITS[s.split].name:
      (s.workoutTitle || 'не определён');
    o.textContent=fmtDate(s.date)+' · '+name;
    sd.appendChild(o);
  });
  if(SESSIONS.some(s=>s.id===old))sd.value=old;
}

function renderExercise(){
  const ex=document.getElementById('selExercise').value;
  document.getElementById('exTitle').textContent=ex||'—';
  const rows=RAW.filter(x=>x.exercise===ex);
  if(!rows.length){ document.getElementById('exKpis').innerHTML=''; drawExChart([]); return; }

  const byDay={};
  rows.forEach(x=>{
    if(!byDay[x.date]) byDay[x.date]={date:x.date,maxW:x.weight,best:x.e1,vol:x.volume,reps:x.reps};
    else{ const e=byDay[x.date]; if(x.weight>e.maxW){e.maxW=x.weight;e.reps=x.reps;} e.best=Math.max(e.best,x.e1); e.vol+=x.volume; }
  });
  const days=Object.values(byDay).sort((a,b)=>a.date<b.date?-1:1);
  const first=days[0], last=days[days.length-1];
  const bestEver=Math.max(...days.map(d=>d.best));
  const growth=first.best? Math.round((last.best-first.best)/first.best*100):0;

  const kpi=(k,v,cls='')=>`<div class="kpi"><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`;
  document.getElementById('exKpis').innerHTML=
    kpi('Тренировок', days.length)+
    kpi('Текущий e1RM', round1(last.best)+' кг')+
    kpi('Лучший e1RM', round1(bestEver)+' кг')+
    kpi('Рост за всё время',(growth>=0?'+':'')+growth+'%', growth>=0?'up':'down');
  drawExChart(days);
}

function drawExChart(days){
  const ctx=document.getElementById('exChart');
  if(exChart){ exChart.destroy(); exChart=null; }
  if(!days.length) return;
  const labels=days.map(d=>fmtDate(d.date));
  const grid='#2a3040', mut='#8b93a7';
  exChart=new Chart(ctx,{
    data:{ labels, datasets:[
      { type:'bar', label:'Тоннаж, кг', data:days.map(d=>Math.round(d.vol)), yAxisID:'y',
        backgroundColor:'rgba(91,157,255,.35)', borderColor:'#5b9dff', borderWidth:1, borderRadius:4, order:2 },
      { type:'line', label:'e1RM, кг', data:days.map(d=>round1(d.best)), yAxisID:'y1',
        borderColor:'#c6f24e', backgroundColor:'#c6f24e', borderWidth:3, tension:.25,
        pointRadius:4, pointBackgroundColor:'#c6f24e', order:1 } ] },
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{ legend:{labels:{color:mut,font:{family:'Inter'},usePointStyle:true,boxWidth:8}} },
      scales:{
        x:{ ticks:{color:mut,maxRotation:45}, grid:{color:grid} },
        y:{ position:'left', title:{display:true,text:'Тоннаж',color:'#5b9dff'}, ticks:{color:mut}, grid:{color:grid} },
        y1:{ position:'right', title:{display:true,text:'e1RM',color:'#c6f24e'}, ticks:{color:mut}, grid:{drawOnChartArea:false} }
      } }
  });
}

function renderDay(){
  const session=SESSIONS.find(s=>s.id===document.getElementById('selDate').value);
  const day=session?session.date:'';
  const label=session?(session.split&&CONFIG.SPLITS[session.split]?CONFIG.SPLITS[session.split].name:(session.workoutTitle||'не определён')):'';
  document.getElementById('dayTitle').textContent=day?fmtDate(day)+' · '+label:'—';
  const rows=RAW.filter(x=>(x.workoutId?'w:'+x.workoutId:'legacy:'+x.date)===(session&&session.id));
  const body=document.getElementById('dayBody');
  if(!rows.length){ body.innerHTML='<div class="empty">Нет данных за этот день.</div>'; return; }

  const today={};
  rows.forEach(x=>{ (today[x.exercise]=today[x.exercise]||[]).push(x); });

  let dayVol=0;
  let html='<div class="exlist">';
  Object.entries(today).forEach(([ex,sets])=>{
    const maxW=Math.max(...sets.map(s=>s.weight));
    const repsStr=sets.map(s=>s.reps).join(' / ');
    const todayTop=Math.max(...sets.map(s=>s.e1));
    dayVol+=sets.reduce((a,s)=>a+s.volume,0);

    const hist=RAW.filter(x=>x.exercise===ex);

    // прошлый раз — последняя дата строго раньше выбранной
    const prevByDay={};
    hist.forEach(x=>{ if(x.date<day) (prevByDay[x.date]=prevByDay[x.date]||[]).push(x); });
    const prevKeys=Object.keys(prevByDay).sort();
    let prevHtml='<span class="val" style="color:var(--dim)">—</span>', prevTop=null;
    if(prevKeys.length){
      const pk=prevKeys[prevKeys.length-1], ps=prevByDay[pk];
      const pW=Math.max(...ps.map(s=>s.weight));
      const pR=ps.map(s=>s.reps).join(' / ');
      prevTop=Math.max(...ps.map(s=>s.e1));
      prevHtml=`<span class="val">${pW} × ${pR} · e1RM ${round1(prevTop)} <span class="date">· ${ddmm(pk)}</span></span>`;
    }

    // лучший — макс e1RM за всю историю
    let best={e1:0,w:0,r:0};
    hist.forEach(x=>{ if(x.e1>best.e1) best={e1:x.e1,w:x.weight,r:x.reps}; });
    const bestHtml=best.e1?`e1RM ${round1(best.e1)} (${best.w}×${best.r})`:'—';

    // стрелка Δ vs прошлый раз
    let delta='<span class="delta same">—</span>';
    if(prevTop!=null){
      const d=round1(todayTop-prevTop);
      if(d>0.5) delta=`<span class="delta up">▲ +${d}</span>`;
      else if(d<-0.5) delta=`<span class="delta down">▼ ${d}</span>`;
      else delta=`<span class="delta same">= ${d}</span>`;
    }

    html+=`<div class="exrow">
      <div class="exrow-head"><span class="exrow-name">${safe(ex)}</span>${delta}</div>
      <div class="exline today"><span class="lbl">Сегодня</span><span class="val">${maxW} × ${repsStr} · <b>e1RM ${round1(todayTop)}</b></span></div>
      <div class="exline"><span class="lbl">Прошлый</span>${prevHtml}</div>
      <div class="exline"><span class="lbl">Лучший</span><span class="val">${bestHtml}</span></div>
    </div>`;
  });
  html+='</div>';
  html+=`<div class="daytotal"><span class="l">Тоннаж тренировки</span><span class="v">${kg(dayVol)}</span></div>`;
  body.innerHTML=html;
}

loadData();
</script>
</body>
</html>
